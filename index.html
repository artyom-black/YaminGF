<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
>

<title>♡</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;

    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Sans",
        "Yu Gothic",
        sans-serif;

    background: #050509;
    color: white;
}


/* =========================================================
   BACKGROUND
========================================================= */

#background {
    position: fixed;
    inset: 0;

    z-index: 0;

    overflow: hidden;

    background:
        radial-gradient(
            circle at 15% 15%,
            rgba(255, 55, 125, .19),
            transparent 34%
        ),
        radial-gradient(
            circle at 85% 80%,
            rgba(112, 74, 255, .20),
            transparent 37%
        ),
        linear-gradient(
            155deg,
            #050509,
            #110a17 50%,
            #050509
        );
}


.glow {
    position: absolute;

    border-radius: 50%;

    filter: blur(90px);

    opacity: .30;
}


.glow.one {
    width: 330px;
    height: 330px;

    background: #ff3e88;

    left: -160px;
    top: -120px;

    animation:
        glowOne
        8s
        ease-in-out
        infinite
        alternate;
}


.glow.two {
    width: 350px;
    height: 350px;

    background: #775cff;

    right: -180px;
    bottom: -140px;

    animation:
        glowTwo
        9s
        ease-in-out
        infinite
        alternate;
}


@keyframes glowOne {

    from {
        transform:
            translate(0,0)
            scale(1);
    }

    to {
        transform:
            translate(100px,100px)
            scale(1.3);
    }

}


@keyframes glowTwo {

    from {
        transform:
            translate(0,0)
            scale(1);
    }

    to {
        transform:
            translate(-90px,-80px)
            scale(1.25);
    }

}



/* =========================================================
   STARS
========================================================= */

.star {
    position: fixed;

    z-index: 1;

    width: 3px;
    height: 3px;

    border-radius: 50%;

    background: white;

    pointer-events: none;

    animation:
        starBlink
        var(--speed)
        ease-in-out
        infinite;
}


@keyframes starBlink {

    0%,
    100% {
        opacity: .08;
        transform: scale(.7);
    }

    50% {
        opacity: .85;
        transform: scale(1.7);
    }

}



/* =========================================================
   MUSIC
========================================================= */

#musicButton {

    position: fixed;

    top: max(
        16px,
        env(safe-area-inset-top)
    );

    right: 16px;

    z-index: 999;

    width: 46px;
    height: 46px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    border:
        1px solid
        rgba(255,255,255,.12);

    background:
        rgba(14,10,20,.58);

    backdrop-filter:
        blur(16px);

    -webkit-backdrop-filter:
        blur(16px);

    color: white;

    font-size: 19px;

    cursor: pointer;
}


#musicButton.playing {

    animation:
        musicPulse
        1.6s
        ease-in-out
        infinite;

}


@keyframes musicPulse {

    0%,
    100% {
        box-shadow:
            0 0 0 0
            rgba(255,60,135,.32);
    }

    50% {
        box-shadow:
            0 0 0 10px
            rgba(255,60,135,0);
    }

}



/* =========================================================
   APP
========================================================= */

#app {

    position: relative;

    z-index: 10;

    width: 100%;
    height: 100svh;

    overflow: hidden;

}


.screen {

    position: absolute;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    padding:
        max(
            60px,
            env(safe-area-inset-top)
        )
        18px
        max(
            35px,
            env(safe-area-inset-bottom)
        );

    opacity: 0;

    visibility: hidden;

    transform:
        scale(.96);

    transition:

        opacity
        .7s
        ease,

        transform
        .7s
        cubic-bezier(.18,.8,.2,1),

        visibility
        .7s;
}


.screen.active {

    opacity: 1;

    visibility: visible;

    transform:
        scale(1);

}


.container {

    width: 100%;

    max-width: 430px;

    text-align: center;

    position: relative;

}



/* =========================================================
   INTRO
========================================================= */

.secretLabel {

    font-size: 10px;

    letter-spacing: 7px;

    opacity: .28;

    margin-bottom: 30px;

}


.secretHeart {

    position: relative;

    width: 130px;
    height: 130px;

    margin:
        0 auto
        30px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    font-size: 52px;

    border:
        1px solid
        rgba(255,255,255,.11);

    background:

        linear-gradient(
            145deg,
            rgba(255,255,255,.12),
            rgba(255,255,255,.025)
        );

    box-shadow:
        0 20px 75px
        rgba(255,55,135,.18);

    animation:
        secretFloat
        2s
        ease-in-out
        infinite;

}


.secretHeart::before,
.secretHeart::after {

    content: "";

    position: absolute;

    inset: -10px;

    border-radius: 50%;

    border:
        1px solid
        rgba(255,75,145,.24);

    animation:
        ringPulse
        2.2s
        ease-out
        infinite;

}


.secretHeart::after {

    animation-delay:
        1.1s;

}


@keyframes secretFloat {

    0%,
    100% {
        transform:
            translateY(0)
            scale(1);
    }

    50% {
        transform:
            translateY(-9px)
            scale(1.04);
    }

}


@keyframes ringPulse {

    0% {
        transform:
            scale(.75);

        opacity: 0;
    }

    25% {
        opacity: .75;
    }

    100% {
        transform:
            scale(1.6);

        opacity: 0;
    }

}


.secretTitle {

    font-size:
        clamp(
            28px,
            8vw,
            40px
        );

    font-weight: 700;

    line-height: 1.5;

}



/* =========================================================
   COUPLE PHOTO STAGE
========================================================= */

#photoStage {

    position: relative;

    width: 100%;

    height: min(
        570px,
        72svh
    );

}


/* -------------------------
   CONNECTING LINE
-------------------------- */

.connection {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 170px;
    height: 2px;

    transform:
        translate(-50%,-50%);

    overflow: hidden;

    opacity: .8;

}


.connection::before {

    content: "";

    position: absolute;

    inset: 0;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(255,110,170,.8),
            white,
            rgba(160,120,255,.8),
            transparent
        );

    animation:
        connectionMove
        1.3s
        linear
        infinite;

}


@keyframes connectionMove {

    from {
        transform:
            translateX(-100%);
    }

    to {
        transform:
            translateX(100%);
    }

}



/* -------------------------
   CENTER HEART
-------------------------- */

.centerHeart {

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%,-50%);

    z-index: 8;

    font-size: 37px;

    filter:
        drop-shadow(
            0 0 20px
            rgba(255,75,145,.65)
        );

    animation:
        centerHeartbeat
        1s
        ease-in-out
        infinite;

}


@keyframes centerHeartbeat {

    0%,
    100% {

        transform:
            translate(-50%,-50%)
            scale(1);

    }

    50% {

        transform:
            translate(-50%,-50%)
            scale(1.25);

    }

}



/* =========================================================
   BIG PHOTO CARDS
========================================================= */

.photoCard {

    position: absolute;

    width:
        clamp(
            145px,
            40vw,
            175px
        );

    height:
        clamp(
            205px,
            53vw,
            240px
        );

    border-radius: 28px;

    overflow: hidden;

    border:
        1px solid
        rgba(255,255,255,.13);

    background:
        rgba(255,255,255,.04);

    box-shadow:
        0 25px 70px
        rgba(0,0,0,.35);

    transition:
        transform
        1s
        cubic-bezier(.17,.84,.25,1),
        left
        1s
        cubic-bezier(.17,.84,.25,1),
        right
        1s
        cubic-bezier(.17,.84,.25,1),
        top
        1s
        cubic-bezier(.17,.84,.25,1),
        bottom
        1s
        cubic-bezier(.17,.84,.25,1);

}


.photoCard::after {

    content: "";

    position: absolute;

    inset: 0;

    pointer-events: none;

    background:

        linear-gradient(
            145deg,
            rgba(255,255,255,.14),
            transparent 30%
        );

}


.photoCard img {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    opacity: 0;

    transform:
        scale(1.15);

    transition:
        opacity
        .8s
        ease,

        transform
        1.3s
        cubic-bezier(.2,.8,.2,1);

}


.photoCard img.visible {

    opacity: 1;

    transform:
        scale(1);

}



/* =========================================================
   PHOTO POSITION 1
========================================================= */

.photoCard.me {

    left: -55%;

    top: 14%;

    transform:
        rotate(-15deg)
        scale(.8);

}


.photoCard.she {

    right: -55%;

    bottom: 13%;

    transform:
        rotate(15deg)
        scale(.8);

}


.photoCard.me.enter {

    left: 5%;

    transform:
        rotate(-7deg)
        scale(1);

}


.photoCard.she.enter {

    right: 5%;

    transform:
        rotate(7deg)
        scale(1);

}



/* =========================================================
   COME CLOSER
========================================================= */

.photoCard.me.close {

    left: 18%;

    top: 24%;

    transform:
        rotate(-4deg)
        scale(1.02);

}


.photoCard.she.close {

    right: 18%;

    bottom: 23%;

    transform:
        rotate(4deg)
        scale(1.02);

}



/* =========================================================
   CROSS POSITION
========================================================= */

.photoCard.me.cross {

    left: 50%;

    top: 8%;

    transform:
        translateX(-88%)
        rotate(7deg)
        scale(.96);

}


.photoCard.she.cross {

    right: 50%;

    bottom: 6%;

    transform:
        translateX(88%)
        rotate(-7deg)
        scale(.96);

}



/* =========================================================
   ORBIT
========================================================= */

.photoCard.me.orbit {

    left: 7%;
    top: 28%;

    transform:
        rotate(6deg)
        scale(.94);

    animation:
        meOrbit
        2.3s
        ease-in-out
        infinite;

}


.photoCard.she.orbit {

    right: 7%;
    bottom: 27%;

    transform:
        rotate(-6deg)
        scale(.94);

    animation:
        sheOrbit
        2.3s
        ease-in-out
        infinite;

}


@keyframes meOrbit {

    0%,
    100% {

        translate:
            0
            0;

    }

    50% {

        translate:
            15px
            -13px;

    }

}


@keyframes sheOrbit {

    0%,
    100% {

        translate:
            0
            0;

    }

    50% {

        translate:
            -15px
            13px;

    }

}



/* =========================================================
   PHOTO TEXT
========================================================= */

.photoText {

    position: absolute;

    left: 0;
    right: 0;

    bottom: -5px;

    z-index: 12;

    font-size:
        clamp(
            27px,
            8vw,
            39px
        );

    font-weight: 700;

    line-height: 1.5;

    opacity: 0;

    transform:
        translateY(15px);

    transition:
        opacity
        .6s
        ease,

        transform
        .6s
        ease;

}


.photoText.show {

    opacity: 1;

    transform:
        translateY(0);

}



/* =========================================================
   QUESTION
========================================================= */

.questionCard {

    position: relative;

    width: 100%;

    padding:
        34px
        21px
        23px;

    border-radius: 30px;

    border:
        1px solid
        rgba(255,255,255,.11);

    background:

        linear-gradient(
            145deg,
            rgba(255,255,255,.10),
            rgba(255,255,255,.028)
        );

    backdrop-filter:
        blur(20px);

    -webkit-backdrop-filter:
        blur(20px);

    box-shadow:
        0 25px 90px
        rgba(0,0,0,.35);

    overflow: hidden;

}


.questionCard::before {

    content: "";

    position: absolute;

    width: 220px;
    height: 220px;

    left: 50%;
    top: -150px;

    transform:
        translateX(-50%);

    border-radius: 50%;

    background:
        rgba(255,65,140,.17);

    filter:
        blur(70px);

}



/* =========================================================
   MINI COUPLE
========================================================= */

.miniCouple {

    height: 116px;

    position: relative;

    margin-bottom: 7px;

}


.miniPhoto {

    position: absolute;

    width: 83px;
    height: 105px;

    top: 2px;

    overflow: hidden;

    border-radius: 20px;

    border:
        1px solid
        rgba(255,255,255,.13);

    box-shadow:
        0 10px 35px
        rgba(0,0,0,.28);

}


.miniPhoto img {

    width: 100%;
    height: 100%;

    object-fit: cover;

}


.miniPhoto.me {

    left:
        calc(
            50% - 84px
        );

    transform:
        rotate(-9deg);

}


.miniPhoto.she {

    right:
        calc(
            50% - 84px
        );

    transform:
        rotate(9deg);

}


.miniHeart {

    position: absolute;

    left: 50%;
    top: 45%;

    z-index: 5;

    transform:
        translate(-50%,-50%);

    font-size: 25px;

    animation:
        centerHeartbeat
        1s
        ease-in-out
        infinite;

}



/* =========================================================
   QUESTION TEXT
========================================================= */

.question {

    position: relative;

    z-index: 3;

    font-size:
        clamp(
            28px,
            8vw,
            37px
        );

    font-weight: 700;

    line-height: 1.6;

    margin-bottom: 25px;

}



/* =========================================================
   BUTTONS
========================================================= */

.buttonZone {

    position: relative;

    width: 100%;
    height: 140px;

}


#yesButton {

    position: absolute;

    left: 50%;
    top: 0;

    transform:
        translateX(-50%);

    width: 100%;
    height: 59px;

    border: 0;

    border-radius: 18px;

    color: white;

    font-size: 17px;

    font-weight: 700;

    background:

        linear-gradient(
            135deg,
            #ff458b,
            #9b5fff
        );

    box-shadow:
        0 14px 40px
        rgba(255,55,130,.23);

    cursor: pointer;

}


#yesButton:active {

    transform:
        translateX(-50%)
        scale(.96);

}


#noButton {

    position: absolute;

    left: 50%;
    top: 80px;

    transform:
        translateX(-50%);

    width: 115px;
    height: 48px;

    border-radius: 15px;

    border:
        1px solid
        rgba(255,255,255,.10);

    background:
        rgba(255,255,255,.055);

    color:
        rgba(255,255,255,.72);

    font-size: 14px;

    touch-action: none;

    transition:

        left
        .16s
        cubic-bezier(.2,.9,.3,1),

        top
        .16s
        cubic-bezier(.2,.9,.3,1),

        transform
        .16s
        ease;

}



/* =========================================================
   FINAL
========================================================= */

.finalStage {

    position: relative;

    width: 100%;
    height: 330px;

    margin-bottom: 15px;

}


.finalPhoto {

    position: absolute;

    width:
        clamp(
            135px,
            38vw,
            160px
        );

    height:
        clamp(
            185px,
            49vw,
            215px
        );

    overflow: hidden;

    border-radius: 27px;

    border:
        1px solid
        rgba(255,255,255,.14);

    box-shadow:
        0 22px 65px
        rgba(0,0,0,.35);

}


.finalPhoto img {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

}


.finalPhoto.me {

    left: 10%;

    top: 46px;

    transform:
        rotate(-8deg);

    animation:
        finalMe
        2.5s
        ease-in-out
        infinite;

}


.finalPhoto.she {

    right: 10%;

    top: 46px;

    transform:
        rotate(8deg);

    animation:
        finalShe
        2.5s
        ease-in-out
        infinite;

}


@keyframes finalMe {

    0%,
    100% {

        transform:
            rotate(-8deg)
            translateY(0);

    }

    50% {

        transform:
            rotate(-5deg)
            translateY(-9px);

    }

}


@keyframes finalShe {

    0%,
    100% {

        transform:
            rotate(8deg)
            translateY(0);

    }

    50% {

        transform:
            rotate(5deg)
            translateY(-9px);

    }

}


.finalHeart {

    position: absolute;

    left: 50%;
    top: 49%;

    transform:
        translate(-50%,-50%);

    z-index: 10;

    font-size: 48px;

    filter:
        drop-shadow(
            0 0 25px
            rgba(255,70,140,.65)
        );

    animation:
        finalBoom
        .7s
        ease-in-out
        infinite;

}


@keyframes finalBoom {

    0%,
    100% {

        transform:
            translate(-50%,-50%)
            scale(1);

    }

    50% {

        transform:
            translate(-50%,-50%)
            scale(1.22);

    }

}


.finalTitle {

    font-size:
        clamp(
            30px,
            9vw,
            42px
        );

    font-weight: 700;

    line-height: 1.5;

}


.finalSub {

    margin-top: 7px;

    font-size: 17px;

    opacity: .55;

}



/* =========================================================
   PARTICLES
========================================================= */

.particle {

    position: fixed;

    z-index: 600;

    left:
        var(--xStart);

    top:
        var(--yStart);

    pointer-events: none;

    font-size:
        var(--size);

    animation:

        particleFly
        var(--duration)
        cubic-bezier(.12,.7,.2,1)
        forwards;

}


@keyframes particleFly {

    0% {

        opacity: 0;

        transform:
            translate(-50%,-50%)
            scale(.2)
            rotate(0);

    }

    12% {

        opacity: 1;

    }

    100% {

        opacity: 0;

        transform:

            translate(
                calc(
                    -50%
                    +
                    var(--moveX)
                ),
                calc(
                    -50%
                    +
                    var(--moveY)
                )
            )

            scale(1.45)

            rotate(
                var(--rotate)
            );

    }

}



/* =========================================================
   FLASH
========================================================= */

#flash {

    position: fixed;

    inset: 0;

    z-index: 550;

    pointer-events: none;

    opacity: 0;

    background:

        radial-gradient(
            circle,
            rgba(255,120,180,.38),
            rgba(255,60,145,.08) 35%,
            transparent 70%
        );

}


#flash.active {

    animation:
        flashBoom
        .7s
        ease-out;

}


@keyframes flashBoom {

    0% {
        opacity: 0;
    }

    18% {
        opacity: 1;
    }

    100% {
        opacity: 0;
    }

}



/* =========================================================
   SMALL PHONE
========================================================= */

@media (max-height: 680px) {

    #photoStage {

        height:
            min(
                500px,
                69svh
            );

    }


    .photoCard {

        width: 135px;

        height: 185px;

    }


    .questionCard {

        padding:
            25px
            18px
            18px;

    }


    .miniCouple {

        height: 95px;

    }


    .miniPhoto {

        width: 68px;
        height: 87px;

    }


    .miniPhoto.me {

        left:
            calc(
                50% - 69px
            );

    }


    .miniPhoto.she {

        right:
            calc(
                50% - 69px
            );

    }


    .question {

        font-size: 27px;

        line-height: 1.45;

        margin-bottom: 18px;

    }


    .finalStage {

        height: 275px;

    }

}

</style>
</head>

<body>


<div id="background">

    <div class="glow one"></div>

    <div class="glow two"></div>

</div>


<div id="flash"></div>


<!-- =====================================================
     MUSIC
===================================================== -->

<audio
    id="music"
    src="music.mp3"
    autoplay
    loop
    playsinline
    preload="auto">
</audio>


<button
    id="musicButton"
    type="button"
    aria-label="music">

    ♪

</button>



<!-- =====================================================
     APP
===================================================== -->

<div id="app">


    <!-- =================================================
         SCREEN 0
    ================================================== -->

    <section
        class="screen active"
        id="screen0">

        <div class="container">

            <div class="secretLabel">

                SECRET

            </div>


            <div class="secretHeart">

                ♡

            </div>


            <div class="secretTitle">

                ひみつがあるよ…

            </div>

        </div>

    </section>



    <!-- =================================================
         PHOTOS
    ================================================== -->

    <section
        class="screen"
        id="screen1">

        <div class="container">


            <div id="photoStage">


                <div class="connection"></div>


                <div class="centerHeart">

                    ♡

                </div>



                <!-- YOUR PHOTO -->

                <div
                    class="photoCard me"
                    id="meCard">


                    <img
                        id="meFront"
                        class="visible"
                        src="pics/me1.png"
                        alt="">


                    <img
                        id="meBack"
                        src="pics/me2.png"
                        alt="">


                </div>



                <!-- HER PHOTO -->

                <div
                    class="photoCard she"
                    id="sheCard">


                    <img
                        id="sheFront"
                        class="visible"
                        src="pics/she1.png"
                        alt="">


                    <img
                        id="sheBack"
                        src="pics/she2.png"
                        alt="">


                </div>



                <div
                    class="photoText"
                    id="photoText">

                    きみが すき。♡

                </div>


            </div>


        </div>

    </section>



    <!-- =================================================

    </section>


</div>



<script>

/* =========================================================
   PHOTO DATA
========================================================= */

const mePhotos = [

    "pics/me1.png",

    "pics/me2.png",

    "pics/me3.png",

    "pics/me4.png"

];


const shePhotos = [

    "pics/she1.png",

    "pics/she2.png",

    "pics/she3.png",

    "pics/she4.png"

];



/* =========================================================
   PRELOAD EVERYTHING
========================================================= */

[
    ...mePhotos,
    ...shePhotos

].forEach(src => {

    const image = new Image();

    image.src = src;

});



/* =========================================================
   ELEMENTS
========================================================= */

const music =
    document.getElementById(
        "music"
    );


const musicButton =
    document.getElementById(
        "musicButton"
    );


const flash =
    document.getElementById(
        "flash"
    );


const meCard =
    document.getElementById(
        "meCard"
    );


const sheCard =
    document.getElementById(
        "sheCard"
    );


const meFront =
    document.getElementById(
        "meFront"
    );


const meBack =
    document.getElementById(
        "meBack"
    );


const sheFront =
    document.getElementById(
        "sheFront"
    );


const sheBack =
    document.getElementById(
        "sheBack"
    );


const photoText =
    document.getElementById(
        "photoText"
    );


const yesButton =
    document.getElementById(
        "yesButton"
    );


const noButton =
    document.getElementById(
        "noButton"
    );


const buttonZone =
    document.getElementById(
        "buttonZone"
    );


const finalShe =
    document.getElementById(
        "finalShe"
    );


const screens = [

    document.getElementById(
        "screen0"
    ),

    document.getElementById(
        "screen1"
    ),

    document.getElementById(
        "screen2"
    ),

    document.getElementById(
        "screen3"
    )

];


let currentScreen = 0;


let meIndex = 0;

let sheIndex = 0;


let meShowingFront = true;

let sheShowingFront = true;


let noAttempts = 0;



/* =========================================================
   STARS
========================================================= */

for (
    let i = 0;
    i < 42;
    i++
) {

    const star =
        document.createElement(
            "div"
        );


    star.className =
        "star";


    star.style.left =
        Math.random()
        *
        100
        +
        "vw";


    star.style.top =
        Math.random()
        *
        100
        +
        "vh";


    star.style.setProperty(

        "--speed",

        (
            1.4
            +
            Math.random()
            *
            3.5
        )
        +
        "s"

    );


    document.body.appendChild(
        star
    );

}



/* =========================================================
   MUSIC
========================================================= */

music.volume = .72;

music.muted = false;


/*
    Try literally as soon as JS is parsed.
*/

async function attemptMusic() {

    try {

        music.muted = false;

        music.volume = .72;


        await music.play();


        setMusicState(
            true
        );

    }

    catch (error) {

        setMusicState(
            false
        );

    }

}


function setMusicState(
    playing
) {

    if (playing) {

        musicButton.textContent =
            "♫";


        musicButton.classList.add(
            "playing"
        );

    }

    else {

        musicButton.textContent =
            "♪";


        musicButton.classList.remove(
            "playing"
        );

    }

}


/*
    Multiple automatic attempts.
*/

attemptMusic();


window.addEventListener(

    "load",

    attemptMusic

);


window.addEventListener(

    "pageshow",

    attemptMusic

);


document.addEventListener(

    "visibilitychange",

    () => {

        if (
            !document.hidden
            &&
            music.paused
        ) {

            attemptMusic();

        }

    }

);


/*
    Retry several times automatically.
*/

setTimeout(
    attemptMusic,
    150
);


setTimeout(
    attemptMusic,
    500
);


setTimeout(
    attemptMusic,
    1200
);


setTimeout(
    attemptMusic,
    2500
);



/*
    Manual ON/OFF control.
*/

musicButton.addEventListener(

    "click",

    async event => {

        event.stopPropagation();


        if (
            music.paused
        ) {

            try {

                await music.play();

                setMusicState(
                    true
                );

            }

            catch (
                error
            ) {}

        }

        else {

            music.pause();


            setMusicState(
                false
            );

        }

    }

);



/* =========================================================
   SCREEN
========================================================= */

function changeScreen(
    next
) {

    screens[
        currentScreen
    ]
    .classList
    .remove(
        "active"
    );


    currentScreen =
        next;


    setTimeout(
        () => {

            screens[
                currentScreen
            ]
            .classList
            .add(
                "active"
            );

        },
        180
    );

}



/* =========================================================
   PHOTO SWAPPING
========================================================= */

function changeMePhoto(
    index
) {

    meIndex =
        index;


    if (
        meShowingFront
    ) {

        meBack.src =
            mePhotos[
                meIndex
            ];


        meBack
            .classList
            .add(
                "visible"
            );


        meFront
            .classList
            .remove(
                "visible"
            );

    }

    else {

        meFront.src =
            mePhotos[
                meIndex
            ];


        meFront
            .classList
            .add(
                "visible"
            );


        meBack
            .classList
            .remove(
                "visible"
            );

    }


    meShowingFront =
        !meShowingFront;

}


function changeShePhoto(
    index
) {

    sheIndex =
        index;


    if (
        sheShowingFront
    ) {

        sheBack.src =
            shePhotos[
                sheIndex
            ];


        sheBack
            .classList
            .add(
                "visible"
            );


        sheFront
            .classList
            .remove(
                "visible"
            );

    }

    else {

        sheFront.src =
            shePhotos[
                sheIndex
            ];


        sheFront
            .classList
            .add(
                "visible"
            );


        sheBack
            .classList
            .remove(
                "visible"
            );

    }


    sheShowingFront =
        !sheShowingFront;

}



/* =========================================================
   ROMANTIC AUTOMATIC SEQUENCE
========================================================= */


/*
    INTRO
*/

setTimeout(
    () => {

        changeScreen(
            1
        );

    },
    1300
);



/*
    PHOTOS FLY IN
*/

setTimeout(
    () => {

        meCard.classList.add(
            "enter"
        );


        sheCard.classList.add(
            "enter"
        );


        photoText.classList.add(
            "show"
        );


        boom(
            16
        );

    },
    1800
);



/*
    pair #2
*/

setTimeout(
    () => {

        changeMePhoto(
            1
        );


        changeShePhoto(
            1
        );


        meCard.classList.add(
            "close"
        );


        sheCard.classList.add(
            "close"
        );


        photoText.innerHTML =
            "もっと はなしたい。♡";


        flashEffect();


        boom(
            22
        );

    },
    3600
);



/*
    pair #3
*/

setTimeout(
    () => {

        changeMePhoto(
            2
        );


        changeShePhoto(
            2
        );


        meCard.classList.remove(
            "close"
        );


        sheCard.classList.remove(
            "close"
        );


        meCard.classList.add(
            "cross"
        );


        sheCard.classList.add(
            "cross"
        );


        photoText.innerHTML =
            "もっと いっしょに。♡";


        boom(
            26
        );

    },
    5400
);



/*
    pair #4
*/

setTimeout(
    () => {

        changeMePhoto(
            3
        );


        changeShePhoto(
            3
        );


        meCard.classList.remove(
            "cross"
        );


        sheCard.classList.remove(
            "cross"
        );


        meCard.classList.add(
            "orbit"
        );


        sheCard.classList.add(
            "orbit"
        );


        photoText.innerHTML =
            "だから… ♡";


        flashEffect();


        boom(
            35
        );

    },
    7200
);



/*
    QUESTION
*/

setTimeout(
    () => {

        changeScreen(
            2
        );


        setTimeout(
            () => {

                boom(
                    24
                );

            },
            400
        );

    },
    9200
);



/* =========================================================
   NO BUTTON 😂
========================================================= */

const noMessages = [

    "いいえ",

    "え？😂",

    "だめ 😂",

    "むり 😌",

    "ほんと？",

    "にげる 😂",

    "nope ♡"

];


function escapeNo() {

    noAttempts++;


    noButton.textContent =

        noMessages[

            Math.min(

                noAttempts,

                noMessages.length - 1

            )

        ];


    const zone =
        buttonZone
        .getBoundingClientRect();


    const w =
        noButton
        .offsetWidth;


    const h =
        noButton
        .offsetHeight;


    const maxX =
        zone.width
        -
        w;


    const minY =
        68;


    const maxY =
        zone.height
        -
        h;


    let newX =
        Math.random()
        *
        maxX;


    let newY =
        minY
        +
        Math.random()
        *
        Math.max(
            1,
            maxY
            -
            minY
        );


    noButton.style.transform =
        "translateX(0)";


    noButton.style.left =
        newX
        +
        "px";


    noButton.style.top =
        newY
        +
        "px";


    heartBurst(

        zone.left
        +
        newX
        +
        w / 2,

        zone.top
        +
        newY
        +
        h / 2,

        6

    );


    if (
        navigator.vibrate
    ) {

        navigator.vibrate(
            20
        );

    }

}



/*
    Desktop
*/

noButton.addEventListener(

    "mouseenter",

    escapeNo

);



/*
    Mobile

    pointerdown happens before
    normal click.
*/

noButton.addEventListener(

    "pointerdown",

    event => {

        event.preventDefault();

        event.stopPropagation();

        escapeNo();

    }

);



/*
    Impossible fallback click.
*/

noButton.addEventListener(

    "click",

    event => {

        event.preventDefault();

        event.stopPropagation();

        escapeNo();

    }

);



/* =========================================================
   YES ❤️
========================================================= */

yesButton.addEventListener(

    "click",

    () => {


        flashEffect();


        boom(
            70
        );


        if (
            navigator.vibrate
        ) {

            navigator.vibrate(
                [
                    70,
                    40,
                    110
                ]
            );

        }


        changeScreen(
            3
        );


        startFinalHerPhotos();


        setTimeout(
            () => {

                boom(
                    55
                );

            },
            600
        );


        setTimeout(
            () => {

                flashEffect();

                boom(
                    45
                );

            },
            1400
        );


        setTimeout(
            () => {

                boom(
                    35
                );

            },
            2300
        );

    }

);



/* =========================================================
   FINAL HER IMAGE LOOP
========================================================= */

let finalSheIndex = 0;


function startFinalHerPhotos() {

    /*
       Your image NEVER changes.
       It stays me1.png.
    */


    setInterval(
        () => {


            if (
                currentScreen
                !==
                3
            ) {

                return;

            }


            finalSheIndex =

                (
                    finalSheIndex
                    +
                    1
                )

                %

                shePhotos.length;


            finalShe.style.opacity =
                "0";


            setTimeout(
                () => {

                    finalShe.src =
                        shePhotos[
                            finalSheIndex
                        ];


                    finalShe.style.opacity =
                        "1";

                },
                220
            );


        },
        1800
    );

}



/* =========================================================
   FLASH
========================================================= */

function flashEffect() {

    flash.classList.remove(
        "active"
    );


    void flash.offsetWidth;


    flash.classList.add(
        "active"
    );

}



/* =========================================================
   MASSIVE BOOM 😂
========================================================= */

function boom(
    amount
) {

    flashEffect();


    heartBurst(

        window.innerWidth
        /
        2,

        window.innerHeight
        /
        2,

        amount

    );

}



/* =========================================================
   PARTICLES
========================================================= */

function heartBurst(
    x,
    y,
    amount
) {

    const symbols = [

        "♡",

        "♥",

        "❤",

        "♡",

        "✦",

        "♡"

    ];


    for (
        let i = 0;
        i < amount;
        i++
    ) {


        setTimeout(
            () => {


                const particle =

                    document.createElement(
                        "div"
                    );


                particle.className =
                    "particle";


                particle.textContent =

                    symbols[

                        Math.floor(

                            Math.random()
                            *
                            symbols.length

                        )

                    ];


                const angle =

                    Math.random()
                    *
                    Math.PI
                    *
                    2;


                const distance =

                    70
                    +
                    Math.random()
                    *
                    320;


                const moveX =

                    Math.cos(
                        angle
                    )

                    *

                    distance;


                const moveY =

                    Math.sin(
                        angle
                    )

                    *

                    distance;


                particle.style.setProperty(

                    "--xStart",

                    x
                    +
                    "px"

                );


                particle.style.setProperty(

                    "--yStart",

                    y
                    +
                    "px"

                );


                particle.style.setProperty(

                    "--moveX",

                    moveX
                    +
                    "px"

                );


                particle.style.setProperty(

                    "--moveY",

                    moveY
                    +
                    "px"

                );


                particle.style.setProperty(

                    "--size",

                    (
                        13
                        +
                        Math.random()
                        *
                        27
                    )

                    +
                    "px"

                );


                particle.style.setProperty(

                    "--rotate",

                    (
                        -150
                        +
                        Math.random()
                        *
                        300
                    )

                    +
                    "deg"

                );


                particle.style.setProperty(

                    "--duration",

                    (
                        1.4
                        +
                        Math.random()
                        *
                        1.8
                    )

                    +
                    "s"

                );


                document.body.appendChild(
                    particle
                );


                setTimeout(
                    () => {

                        particle.remove();

                    },
                    3600
                );


            },
            i * 13
        );

    }

}

</script>
